name: Contract Size Benchmark

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Install bc and jq
        run: sudo apt-get update && sudo apt-get install -y bc jq

      - name: Create benchmark worktrees
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          rm -rf "$RUNNER_TEMP/benchmark-base" "$RUNNER_TEMP/benchmark-pr"
          git worktree add --detach "$RUNNER_TEMP/benchmark-base" "origin/${{ github.base_ref }}"
          git worktree add --detach "$RUNNER_TEMP/benchmark-pr" "$GITHUB_SHA"

      - name: Run benchmark
        if: github.event_name != 'pull_request'
        run: bash scripts/benchmark.sh

      - name: Run PR benchmark
        if: github.event_name == 'pull_request'
        working-directory: ${{ runner.temp }}/benchmark-pr
        env:
          OUTPUT_FILE: ${{ github.workspace }}/benchmark-results.json
        run: bash scripts/benchmark.sh

      - name: Run base benchmark
        if: github.event_name == 'pull_request'
        working-directory: ${{ runner.temp }}/benchmark-base
        env:
          OUTPUT_FILE: ${{ github.workspace }}/base-benchmark.json
        run: bash scripts/benchmark.sh

      - name: Enforce size budgets
        run: make size-check

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-results.json
            base-benchmark.json
          if-no-files-found: warn

      - name: Compare with base branch
        if: github.event_name == 'pull_request'
        run: |
          echo "## Contract Size Comparison" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Contract | Current Size | Change |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------------|--------|" >> $GITHUB_STEP_SUMMARY

          for contract in factory lp_token pair router staking; do
            BASE_SIZE=$(jq -r ".contracts.$contract.size_bytes // 0" base-benchmark.json)
            PR_SIZE=$(jq -r ".contracts.$contract.size_bytes // 0" benchmark-results.json)

            if [ "$BASE_SIZE" != "0" ] && [ "$PR_SIZE" != "0" ]; then
              DIFF=$((PR_SIZE - BASE_SIZE))
              PERCENT=$(echo "scale=2; ($DIFF * 100) / $BASE_SIZE" | bc)

              if [ "$DIFF" -gt 0 ]; then
                CHANGE="+$DIFF bytes (+${PERCENT}%)"
                if (( $(echo "$PERCENT > 5.0" | bc -l) )); then
                  CHANGE="WARNING: $CHANGE"
                fi
              elif [ "$DIFF" -lt 0 ]; then
                CHANGE="$DIFF bytes (${PERCENT}%)"
              else
                CHANGE="No change"
              fi

              PR_SIZE_KB=$(echo "scale=2; $PR_SIZE / 1024" | bc)
              echo "| $contract | ${PR_SIZE_KB} KB | $CHANGE |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          if jq -e '.contracts | to_entries | map(select(.value.size_bytes == 0)) | length > 0' benchmark-results.json >/dev/null; then
            echo "error: benchmark results contain zero-sized contracts" >&2
            exit 1
          fi

      - name: Check for size regressions
        if: github.event_name == 'pull_request'
        run: |
          WARNING_FOUND=false

          for contract in factory lp_token pair router staking; do
            BASE_SIZE=$(jq -r ".contracts.$contract.size_bytes // 0" base-benchmark.json)
            PR_SIZE=$(jq -r ".contracts.$contract.size_bytes // 0" benchmark-results.json)

            if [ "$BASE_SIZE" != "0" ] && [ "$PR_SIZE" != "0" ]; then
              DIFF=$((PR_SIZE - BASE_SIZE))
              PERCENT=$(echo "scale=2; ($DIFF * 100) / $BASE_SIZE" | bc)

              if (( $(echo "$PERCENT > 5.0" | bc -l) )); then
                echo "WARNING: $contract size increased by ${PERCENT}%"
                WARNING_FOUND=true
              fi
            fi
          done

          if [ "$WARNING_FOUND" = true ]; then
            echo "::warning::One or more contracts have size increases > 5%"
          fi
