[package]
name = "coralswap-lp-token"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
coralswap-shared = { path = "../shared" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Scoped-authorization test helpers (issue #314); dev-only, never in release WASM.
coralswap-shared = { path = "../shared", features = ["test-support"] }
