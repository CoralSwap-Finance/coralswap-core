[package]
name = "coralswap-pair"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
coralswap-flash-receiver-interface = { path = "../flash_receiver_interface" }
coralswap-shared = { path = "../shared" }
ethnum = { version = "*" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Scoped-authorization test helpers (issue #314); dev-only, never in release WASM.
coralswap-shared = { path = "../shared", features = ["test-support"] }
coralswap-lp-token = { path = "../lp_token" }
coralswap-mock-flash-receiver = { path = "../mock_flash_receiver" }
coralswap-malicious-flash-receiver = { path = "../malicious_flash_receiver" }
