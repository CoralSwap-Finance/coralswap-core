[package]
name = "coralswap-router"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
coralswap-shared = { path = "../shared" }
ethnum = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
coralswap-pair = { path = "../pair" }
coralswap-lp-token = { path = "../lp_token" }
